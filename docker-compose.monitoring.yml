version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: compilehub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    extra_hosts:
      - "compilehub-server:host-gateway"
    restart: always

  grafana:
    image: grafana/grafana:10.0.3
    container_name: compilehub-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/compilehub-dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/dashboards/../../provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./k8s/monitoring/compilehub-dashboard.json:/var/lib/grafana/dashboards/compilehub-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: compilehub-network
