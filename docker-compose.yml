version: '3.8'

services:
  compilehub-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: compilehub-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://shivamgupt4880_db_user:KSIAb3kIHs2xZK9C@ac-dy10vbo-shard-00-00.ry4oo4j.mongodb.net:27017,ac-dy10vbo-shard-00-01.ry4oo4j.mongodb.net:27017,ac-dy10vbo-shard-00-02.ry4oo4j.mongodb.net:27017/compilehub?ssl=true&authSource=admin
      - JWT_SECRET=b4b2df2b0e9a6f8b9e6c46a8d6e3bf29f9e1d8820c78a1f8bda9f4f346e29e92
      - PISTON_API_URL=https://emkc.org/api/v2/piston
      - NODE_ENV=production
    volumes:
      - /usr/src/app/node_modules # prevent overwriting container node_modules
    restart: always

  compilehub-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: compilehub-client
    ports:
      - "8080:80"
    depends_on:
      - compilehub-server
    restart: always

  # ─── Monitoring Stack ──────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: compilehub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - compilehub-server
    restart: always

  grafana:
    image: grafana/grafana:10.0.3
    container_name: compilehub-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/compilehub-dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./k8s/monitoring/compilehub-dashboard.json:/var/lib/grafana/dashboards/compilehub-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: compilehub-network
